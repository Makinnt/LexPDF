name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  JLINK_MODULES: java.base,java.logging,java.xml,java.naming,java.management,java.sql,java.desktop,java.net.http,jdk.httpserver,jdk.unsupported

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache LT
        uses: actions/cache@v4
        with:
          path: |
            assets/lt.zip
            assets/lt/
          key: languagetool-assets-Linux

      - name: Build release
        run: cargo build --release

      - name: JDK Temurin 17
        run: |
          curl -sL -o /tmp/jdk.tar.gz https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse
          mkdir -p /tmp/jdk && tar xzf /tmp/jdk.tar.gz -C /tmp/jdk --strip-components=1

      - name: Stage AppDir
        env:
          JAVA_HOME: /tmp/jdk
        run: ./installer/linux/stage-appimage.sh

      - name: Smoke test (JRE + LT real)
        run: |
          test -x ./dist/AppDir/usr/share/lexpdf/jre/bin/java
          ./dist/AppDir/usr/share/lexpdf/jre/bin/java -Xms256m -Xmx1g -Dfile.encoding=UTF-8 \
            -cp ./dist/AppDir/usr/share/lexpdf/lt/languagetool-server.jar \
            org.languagetool.server.HTTPServer --port 8081 > /tmp/lt-ci.log 2>&1 &
          SRV=$!
          for i in $(seq 1 60); do
            sleep 2
            curl -sf http://localhost:8081/v2/languages >/dev/null 2>&1 && break
          done
          curl -s -m 120 -X POST --data "language=es-ES" \
            --data-urlencode "text=Pienso de que la problema es grave." \
            http://localhost:8081/v2/check | tee /tmp/lt-check.json | grep -q DEQUEISMO
          STATUS=$?
          echo '--- server log ---'
          tail -n 30 /tmp/lt-ci.log || true
          kill $SRV 2>/dev/null || true
          exit $STATUS

      - name: AppImage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2
          curl -sL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool ./dist/AppDir ./dist/LexPDF-x86_64.AppImage

      - name: Sube AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LexPDF-linux
          path: dist/LexPDF-x86_64.AppImage

      # el tag re-pushed deja la release anterior en draft y el edit de
      # softprops muere contra ese estado: mejor recrear cada vez (como #28)
      - name: Borra release previa (si existe)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "$GITHUB_REF_NAME" --yes || true

      - name: Release con AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Novedades de la v0.2.0

            - **Resaltados y comentarios de verdad**: se puede resaltar una palabra o un texto arrastrando encima y escribirle un comentario. El resaltado se guarda como anotación Highlight real del PDF (con /QuadPoints, se ve en cualquier lector) y el comentario, dentro.
            - **Resaltado libre**: por área, por recuadro o por selección de texto (por defecto, en una sola banda continua por línea). El panel te enseña el texto que has seleccionado de verdad, en negrita.
            - **Notas adhesivas** (sticky) en cualquier punto, y al pasar el ratón por encima de un resaltado o de una nota sale su comentario en un chip justo encima.
            - **Borrado fiable**: el "Borrar" de la ficha borra la anotación correcta y deja intactos los demás resaltados.
            - **Ajustes con explicación línea a línea** (una opción, una línea) y sub-opción del resaltado libre.
            - **Ventana de Ajustes** propia: color del resaltado, copia de trabajo, motor de revisión, Acerca de y las licencias enteras de cada dependencia (deslizables).
            - **Licencias**: GPL-3.0-only (la exige Slint), con los textos completos de PDFium (BSD), Material Icons (Apache-2.0), lopdf, LanguageTool y compañía.
            - **Copia de trabajo única**: las notas van siempre a `{nombre}_anotado.pdf`; ya no se crea un `_anotado_anotado`. Se pregunta al abrir si la quieres y se guarda al momento.
            - **Documento abierto en memoria**: cambiar de página ya no reabre el PDF (solo renderiza) y la contraseña se pide una sola vez.
            - **PDF con contraseña**: se pueden abrir documentos protegidos (la clave no se guarda en disco).
            - **Red cerrada**: el motor de revisión arranca en un puerto libre por ejecución y con el JVM encerrado (no puede salir a Internet). El PDF nunca sale del PC; solo el texto de cada página, en local.
            - **Permisos**: la copia de trabajo y el historial se guardan en modo 0600 (solo tu usuario).
            - **Tema claro/oscuro** y iconos Material (Apache-2.0).

            Sigue siendo **100% offline**: ni el PDF ni tus textos salen del equipo.
          files: dist/LexPDF-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache LT
        uses: actions/cache@v4
        with:
          path: |
            assets/lt.zip
            assets/lt/
          key: languagetool-assets-Windows

      - name: Build release
        run: cargo build --release

      - name: JDK Temurin 17 + jlink
        shell: pwsh
        run: |
          Invoke-WebRequest https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jdk/hotspot/normal/eclipse -OutFile $env:TEMP/jdk.zip
          Expand-Archive $env:TEMP/jdk.zip -DestinationPath $env:TEMP/jdkdir -Force
          $jdk = (Get-ChildItem $env:TEMP/jdkdir)[0].FullName
          & "$jdk/bin/jlink" --compress=2 --strip-debug --no-header-files --no-man-pages `
            --add-modules $env:JLINK_MODULES --output dist/windows/jre

      - name: Stage + Inno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item target/release/lexpdf.exe dist/windows/
          Copy-Item assets/pdfium/pdfium.dll dist/windows/
          Copy-Item assets/lt dist/windows/lt -Recurse -Force
          Copy-Item assets/licenses dist/windows/licenses -Recurse -Force
      - name: Versión desde el tag (sin la v)
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          "VER=$v" >> $env:GITHUB_OUTPUT
      - name: Compila instalador
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/windows/lexpdf.iss
          options: /DMyAppVersion=${{ steps.ver.outputs.VER }}

      - name: Smoke test (JRE + LT real)
        shell: pwsh
        run: |
          $java = 'dist/windows/jre/bin/java.exe'
          if (-not (Test-Path $java)) { throw 'falta el JRE empaquetado' }
          $p = Start-Process $java -ArgumentList '-Xms256m','-Xmx1g','-Dfile.encoding=UTF-8','-cp','dist/windows/lt/languagetool-server.jar','org.languagetool.server.HTTPServer','--port','8081' -WindowStyle Hidden -PassThru
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep 2
              try { Invoke-WebRequest http://localhost:8081/v2/languages -UseBasicParsing -TimeoutSec 5 | Out-Null; break } catch {}
            }
            $r = Invoke-WebRequest -Method Post -Body @{language='es-ES'; text='Pienso de que la problema es grave.'} -Uri http://localhost:8081/v2/check -UseBasicParsing -TimeoutSec 120
            if ($r.Content -notmatch 'DEQUEISMO') { throw 'LT no responde como se espera' }
          } finally {
            try { Stop-Process -Id $p.Id -Force } catch {}
          }

      # Firma con SignPath (gratis para OSS). Activar con cuenta + repo público:
      # Secrets SIGNPATH_API_TOKEN / SIGNPATH_ORG_ID, descomentar y ajustar slugs.
      # - name: Firma con SignPath
      #   uses: signpath/github-action@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #     project-slug: 'lexpdf'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: 'installer'
      #     output-artifact-directory: 'dist/signed'

      - name: Sube instalador
        uses: actions/upload-artifact@v4
        with:
          name: LexPDF-windows
          path: dist/lexpdf-setup.exe

      - name: Release con instalador
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Novedades de la v0.2.5

            - **Lista de resultados arreglada en Windows**: el scroll llega hasta la última card con todos sus botones (antes el área de resultados se salía por debajo del borde de la ventana y ese trozo nunca se veía).
            - **Botones de las cards uniformes**: filas en mitades iguales (Omitir / Añadir comentario / Obs. gramatical / Borrar / Agrupar).
            - **"Guardar" de Ajustes** ya no sale aplastado.
            - **Limpiar historial**: nuevo botón junto a "Recientes", con diálogo de confirmación.
            - **Chip de comentario** de las notas: texto entero, con wrap y limitado al área visible.
            - **Tests arreglados en Windows** (fixture a temp_dir): 24/24 en verde.

            ## Novedades de la v0.2.0

            - **Resaltados y comentarios de verdad**: se puede resaltar una palabra o un texto arrastrando encima y escribirle un comentario. El resaltado se guarda como anotación Highlight real del PDF (con /QuadPoints, se ve en cualquier lector) y el comentario, dentro.
            - **Resaltado libre**: por área, por recuadro o por selección de texto (por defecto, en una sola banda continua por línea). El panel te enseña el texto que has seleccionado de verdad, en negrita.
            - **Notas adhesivas** (sticky) en cualquier punto, y al pasar el ratón por encima de un resaltado o de una nota sale su comentario en un chip justo encima.
            - **Borrado fiable**: el "Borrar" de la ficha borra la anotación correcta y deja intactos los demás resaltados.
            - **Ajustes con explicación línea a línea** (una opción, una línea) y sub-opción del resaltado libre.
            - **Ventana de Ajustes** propia: color del resaltado, copia de trabajo, motor de revisión, Acerca de y las licencias enteras de cada dependencia (deslizables).
            - **Licencias**: GPL-3.0-only (la exige Slint), con los textos completos de PDFium (BSD), Material Icons (Apache-2.0), lopdf, LanguageTool y compañía.
            - **Copia de trabajo única**: las notas van siempre a `{nombre}_anotado.pdf`; ya no se crea un `_anotado_anotado`. Se pregunta al abrir si la quieres y se guarda al momento.
            - **Documento abierto en memoria**: cambiar de página ya no reabre el PDF (solo renderiza) y la contraseña se pide una sola vez.
            - **PDF con contraseña**: se pueden abrir documentos protegidos (la clave no se guarda en disco).
            - **Red cerrada**: el motor de revisión arranca en un puerto libre por ejecución y con el JVM encerrado (no puede salir a Internet). El PDF nunca sale del PC; solo el texto de cada página, en local.
            - **Permisos**: la copia de trabajo y el historial se guardan en modo 0600 (solo tu usuario).
            - **Tema claro/oscuro** y iconos Material (Apache-2.0).

            Sigue siendo **100% offline**: ni el PDF ni tus textos salen del equipo.
          files: dist/lexpdf-setup.exe
