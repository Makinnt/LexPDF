[package]
name = "lexpdf"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "lexpdf"
path = "src/main.rs"

[dependencies]
slint = "1.10"
pdfium-render = "0.8"
image = "0.25"
rfd = "0.15"
anyhow = "1.0"
ureq = { version = "3", default-features = false } # ponytail: sin TLS (solo http://localhost); sync por defecto
serde = { version = "1", features = ["derive"] } # ponytail: solo para el historial JSON
serde_json = "1" # ponytail: parsea /v2/check sin tipos extra

[build-dependencies]
slint-build = "1.10"
ureq = "3"
zip = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
